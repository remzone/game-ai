services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: rpg
      POSTGRES_DB: rpg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rpg -d rpg']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      DATABASE_URL: postgresql://rpg:${POSTGRES_PASSWORD:-localdev}@db:5432/rpg?schema=public
      STORAGE_DRIVER: postgres
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      GAME_PASSWORD: ${GAME_PASSWORD:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4.1-mini}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
